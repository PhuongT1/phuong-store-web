<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#181b24"/>
      <stop offset="1" stop-color="#0c0e14"/>
    </linearGradient>
    <linearGradient id="d" x1="34" y1="20" x2="94" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F07030"/>
      <stop offset="1" stop-color="#C02810"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="64" fill="url(#bg)"/>
  <!-- Subtle rim -->
  <circle cx="64" cy="64" r="62" stroke="white" stroke-opacity="0.06" stroke-width="1.5" fill="none"/>

  <!--
    D letterform — centered on 128×128 canvas.
    Left edge x=34, right edge (bowl) x=94 → visual center = (34+94)/2 = 64 ✓
    Left bar: x 34–50, width 16px
    Bowl arc: from (50,20) CW to (50,108), r=44 → rightmost 50+44=94
    Path goes TOP→BOTTOM so sweep=1 → bulges RIGHT ✓
  -->
  <path
    d="M 40 20
       L 50 20
       A 44 44 0 0 1 50 108
       L 40 108
       Q 34 108 34 102
       L 34 26
       Q 34 20 40 20
       Z"
    fill="url(#d)"
  />
</svg>





