mutation TransactionProcess($id: ID!, $data: JSON) {
	transactionProcess(id: $id, data: $data) {
		transaction {
			id
			actions
		}
		transactionEvent {
			message
			type
		}
		data
		errors {
			field
			code
			message
		}
	}
}

mutation TransactionInitialize($checkoutId: ID!, $data: JSON!, $paymentGatewayId: String!) {
	transactionInitialize(id: $checkoutId, paymentGateway: { id: $paymentGatewayId, data: $data }) {
		transaction {
			id
		}
		transactionEvent {
			id
			type
		}
		errors {
			field
			message
			code
		}
	}
}
