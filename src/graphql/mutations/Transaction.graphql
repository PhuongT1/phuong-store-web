mutation TransactionProcess($id: ID!, $data: JSON) {
	transactionProcess(id: $id, data: $data) {
		transaction {
			id
			actions
		}
		transactionEvent {
			message
			type
		}
		data
		errors {
			field
			code
			message
		}
	}
}

mutation TransactionInitialize($checkoutId: ID!, $data: JSON!, $paymentGatewayId: String!) {
	transactionInitialize(id: $checkoutId, paymentGateway: { id: $paymentGatewayId, data: $data }) {
		transaction {
			id
		}
		transactionEvent {
			id
			type
		}
		errors {
			field
			message
			code
		}
	}
}

mutation TransactionInitializeFull(
	$checkoutId: ID!
	$action: TransactionFlowStrategyEnum
	$paymentGateway: PaymentGatewayToInitialize!
	$amount: PositiveDecimal
) {
	transactionInitialize(
		id: $checkoutId
		action: $action
		paymentGateway: $paymentGateway
		amount: $amount
	) {
		transaction {
			id
			actions
		}
		transactionEvent {
			message
			type
		}
		data
		errors {
			field
			code
			message
		}
	}
}

mutation PaymentGatewaysInitialize($checkoutId: ID!, $paymentGateways: [PaymentGatewayToInitialize!]) {
	paymentGatewayInitialize(id: $checkoutId, paymentGateways: $paymentGateways) {
		errors {
			field
			message
			code
		}
		gatewayConfigs {
			id
			data
			errors {
				field
				message
				code
			}
		}
	}
}
