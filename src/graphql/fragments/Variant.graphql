fragment VariantPricingInfo on VariantPricingInfo {
	priceUndiscounted {
		gross {
			amount
			currency
		}
	}
	price {
		gross {
			currency
			amount
		}
	}
	onSale
	discount {
		gross {
			amount
			currency
		}
	}
}

fragment VariantDetails on ProductVariant {
	id
	name
	quantityAvailable
	pricing {
		...VariantPricingInfo
	}
	attributes {
		...SelectedAttribute
	}
	media {
		...ProductMedia
	}
}
