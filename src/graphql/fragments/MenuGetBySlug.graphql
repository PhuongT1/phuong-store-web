fragment Category on Category {
	id
	slug
	name
	backgroundImage {
		...BackgroundImage
	}
}

fragment Collection on Collection {
	id
	name
	slug
	backgroundImage {
		...BackgroundImage
	}
}

fragment MenuItem on MenuItem {
	id
	name
	level
	category {
		...Category
	}
	collection {
		...Collection
	}
	page {
		...Page
	}
	url
}
